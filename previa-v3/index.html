<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Previa</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
/* Previa · manual v1.3. Layout e animações adaptados do modelo enviado (seção 1: topo). */
:root {
  --porcelana: #F4F5F2; --tinta: #141A16; --louro: #22402F; --salvia: #8DA392;
  --latao: #A07C45; --halo: #A9E3CF; --pedra: #5F6660; --mesa: #E2E5E0; --branco: #FFFFFF;
  --page: var(--porcelana);
  --ease: cubic-bezier(.65,.05,0,1);
  color-scheme: light;
}
html { font-size: calc(100vw / 90); }
@media (max-width: 991px) { html { font-size: calc(100vw / 60); } }
@media (max-width: 600px) { html { font-size: calc(100vw / 24.375); } }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
img, video, svg { display: block; }
body { background: var(--page); color: var(--tinta); font-family: "Sora", system-ui, sans-serif; overflow-x: clip;
  transition: background-color .7s var(--ease); -webkit-font-smoothing: antialiased; }
html.lenis, html.lenis body { height: auto; }
.lenis.lenis-smooth { scroll-behavior: auto !important; }
main { visibility: hidden; }
html[data-page-ready] main { visibility: visible; }
[data-text-reveal], [data-scroll-reveal] { visibility: hidden; }
:focus-visible { outline: 2px solid var(--latao); outline-offset: 3px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Tipografia: Sora pesada contra Sora leve, no lugar de grotesca + serifa */
.h-hero { font-family: "Sora"; font-weight: 700; font-size: 9rem; line-height: .86em; letter-spacing: -.055em; }
.alt { font-weight: 200; letter-spacing: -.045em; }
.eyebrow-m { font-weight: 300; font-size: 2.5rem; line-height: 1em; letter-spacing: -.035em; }
.para { font-family: "Geist"; font-size: 1.25rem; line-height: 1.45; letter-spacing: -.01em; }
.line { padding-bottom: .08em; margin-bottom: -.08em; }
@media (max-width: 991px) { .h-hero { font-size: 6.4rem; } }
@media (max-width: 600px) { .h-hero { font-size: 4rem; } .eyebrow-m { font-size: 1.75rem; } }

/* 5.1 Abertura: rabisco em Louro */
.wipe { position: fixed; inset: 0; z-index: 1000; pointer-events: none; overflow: clip; }
.wipe svg { width: 100%; height: 100%; }
.wipe path { fill: none; stroke: var(--louro); stroke-linecap: round; stroke-linejoin: round; stroke-width: 0; }
.wipe[data-transition-ready] { display: none; }

/* 5.2 Etiqueta do cursor (Halo) */
.cursor-label { position: fixed; top: 0; left: 0; z-index: 100; pointer-events: none; }
.cursor-label .card { width: 9.5rem; overflow: hidden; background: var(--halo); color: var(--tinta); transform: scale(0); transition: transform .4s var(--ease); position: relative; border-radius: .25rem; }
.cursor-label[data-cursor-marquee-status="active"] .card { transform: scale(1); }
.cursor-label .t { display: flex; position: relative; }
.cursor-label span { font-weight: 600; font-size: 1.1rem; padding: .45em .3em; white-space: nowrap; animation: marq 3s linear infinite paused; flex: none; }
.cursor-label span + span { position: absolute; left: 100%; }
@keyframes marq { to { transform: translateX(-100%); } }

/* 5.3 Navegação */
.nav { position: fixed; inset: 0 0 auto; z-index: 50; display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 1.5rem; pointer-events: none; }
.nav > * { pointer-events: auto; }
.logo { display: inline-flex; align-items: center; gap: .55rem; color: var(--tinta); font-size: 2.1rem; }
.logo svg { width: 2.3rem; height: 2.3rem; }
.word { font-weight: 400; letter-spacing: -.04em; line-height: 1; }
.word .i { position: relative; display: inline-block; }
.word .i::after { content: ""; position: absolute; width: .17em; height: .17em; border-radius: 50%; background: var(--latao); left: 50%; transform: translateX(-50%); top: .06em; }
.pill { position: absolute; left: 50%; top: 1.25rem; translate: -50% 0; height: 3rem; padding: 0 1.25rem; gap: 1.5rem; background: var(--branco); border-radius: 99rem; display: flex; align-items: center; }
.navlink { position: relative; display: flex; flex-direction: column; font-weight: 600; font-size: 1rem; letter-spacing: -.02em; }
.draw-box { position: absolute; left: 0; top: 100%; width: 100%; height: .5em; color: var(--latao); pointer-events: none; }
.draw-box svg { width: 100%; height: 100%; overflow: visible; }
.contact { height: 3rem; padding: 0 1.25rem; gap: .5rem; background: var(--branco); border-radius: 99rem; display: flex; align-items: center; font-weight: 600; font-size: 1rem; letter-spacing: -.02em; }
.contact .dot { width: .45rem; height: .45rem; border-radius: 50%; background: var(--latao); }
@media (max-width: 991px) { .pill { display: none; } }
@media (max-width: 600px) { .nav { padding: 1rem; } .logo { font-size: 1.6rem; } .logo svg { width: 1.8rem; height: 1.8rem; } .contact { height: 2.5rem; font-size: .95rem; padding: 0 .9rem; } }

/* 5.4 Topo */
.hero { position: relative; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.hero video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 50%; }
.hero .veil { position: absolute; inset: 0; background: radial-gradient(70% 60% at 50% 46%, rgba(244,245,242,.86) 30%, rgba(244,245,242,.35) 75%, rgba(244,245,242,.15)); pointer-events: none; }
.ccard { position: absolute; left: 50%; top: 50%; width: 16rem; aspect-ratio: 1; translate: -50% -50%; overflow: hidden; z-index: 1; visibility: hidden; opacity: 0; border-radius: .5rem; box-shadow: 0 1.5rem 3rem -1.5rem rgba(20,26,22,.45); }
.ccard .media { position: absolute; inset: 0; scale: 1.2; }
.ccard .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
.ccard .media img.on { opacity: 1; }
.hero-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 2rem; margin-top: -3rem; text-align: center; }
.cta { display: inline-flex; align-items: center; gap: .45em; font-weight: 300; font-size: 2.1rem; letter-spacing: -.035em; line-height: 1; }
.cta .txt { position: relative; }
.cta .draw-box { top: 112%; height: .6em; }
.arrow { width: 1em; height: 1em; background: var(--louro); color: var(--branco); display: grid; place-items: center; overflow: hidden; border-radius: .15em; }
.arrow .twin { position: relative; width: .5em; height: .46em; transition: transform .525s cubic-bezier(.175,.885,.32,1.275); }
.arrow .twin svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.arrow .twin svg + svg { top: -100%; }
.cta:hover .arrow .twin { transform: translateY(100%); }

.marquee { position: absolute; left: 0; bottom: 1.5rem; width: 100%; z-index: 2; overflow: hidden; }
.marquee .scroll { display: flex; margin-left: -10%; width: 120%; }
.marquee .coll { display: flex; flex: none; }
.mk { width: 9rem; height: 7rem; margin: 0 2.5rem; display: grid; place-items: center; color: var(--louro); }
.mk svg { width: 60%; height: 60%; overflow: visible; }
.mk path, .mk circle, .mk rect, .mk ellipse, .mk line { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: butt; stroke-linejoin: miter; }
.mk .fill { fill: currentColor; stroke: none; }
.mk .acc { fill: var(--latao); stroke: none; }
@media (max-width: 600px) {
  .hero-content { gap: 1.4rem; margin-top: 5rem; padding: 0 1rem; }
  .cta { font-size: 1.6rem; }
  .mk { width: 5.5rem; height: 5rem; margin: 0 1rem; }
  .ccard { visibility: visible; opacity: 1; width: 7.5rem; top: 13%; translate: -50% 0; rotate: -5deg; }
  .hero video { object-position: 6% 50%; }
}

.next { min-height: 60vh; display: grid; place-items: center; color: var(--pedra); font-family: "Geist"; font-size: 1.1rem; padding: 4rem 1.5rem; text-align: center; }
</style>

  /* 6.1 Rolagem suave */
  let lenis = null;

    lenis = new Lenis({ lerp: 0.165, wheelMultiplier: 1.25 });

    const t = document.querySelector(a.getAttribute('href')); if (!t) return;

    if (video.getAttribute('src') !== src) { video.src = src; }

  function splitFor(el, mode) {
    const hasHover = el.hasAttribute('data-font-weight-hover');

  function textReveal(baseDelay) {
    const els = [...document.querySelectorAll('[data-text-reveal]')];
    const groupIndex = new Map();
    els.forEach(el => {
      const mode = el.dataset.textReveal;
      const g = el.closest('[data-text-reveal-group]');
      let extra = 0;
      if (g) { const n = groupIndex.get(g) || 0; extra = n * 0.12; groupIndex.set(g, n + 1); }

      const targets = mode === 'chars' ? s.chars : s.lines;

        onComplete: () => el.dispatchEvent(new CustomEvent('reveal:done')) });
    });

    'M17.0039 32.6826C32.2307 32.8412 47.4552 32.8277 62.676 32.8118C67.3044 32.807 96.546 33.0555 104.728 32.0775C113.615 31.0152 104.516 28.3028 102.022 27.2826C89.9573 22.3465 77.3751 19.0254 65.0451 15.0552C57.8987 12.7542 37.2813 8.49399 44.2314 6.10216C50.9667 3.78422 64.2873 5.81914 70.4249 5.96641C105.866 6.81677 141.306 7.58809 176.75 8.59886C217.874 9.77162 258.906 11.0553 300 14.4892',
    'M4.99805 20.9998C65.6267 17.4649 126.268 13.845 187.208 12.8887C226.483 12.2723 265.751 13.2796 304.998 13.9998',
    'M5 29.8857C52.3147 26.9322 99.4329 21.6611 146.503 17.1765C151.753 16.6763 157.115 15.9505 162.415 15.6551C163.28 15.6069 165.074 15.4123 164.383 16.4275C161.704 20.3627 157.134 23.7551 153.95 27.4983C153.209 28.3702 148.194 33.4751 150.669 34.6605C153.638 36.0819 163.621 32.6063 165.039 32.2029C178.55 28.3608 191.49 23.5968 204.869 19.5404C231.903 11.3436 259.347 5.83254 288.793 5.12258C294.094 4.99476 299.722 4.82265 305 5.45025'
  ];
  let lineIdx = Math.floor(Math.random() * LINES.length);
  const makeLine = box => {
    box.innerHTML = `<svg viewBox="0 0 310 40" preserveAspectRatio="none"><path d="${LINES[lineIdx++ % LINES.length]}" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"/></svg>`;
    return box.querySelector('path');
  };
  function initDrawLines() {
    document.querySelectorAll('[data-draw-line]').forEach(link => {
      const box = link.querySelector('.draw-box'); let tween = null; let leaving = false;
      link.addEventListener('mouseenter', () => {
        leaving = false;
        const p = makeLine(box);
        gsap.set(p, { drawSVG: '0%' });
        tween = gsap.to(p, { drawSVG: '100%', duration: 0.5, ease: 'power2.inOut' });
      });
      link.addEventListener('mouseleave', () => {
        leaving = true;
        const p = box.querySelector('path'); if (!p) return;
        const out = () => { if (!leaving) return; gsap.to(p, { drawSVG: '100% 100%', duration: 0.5, ease: 'power2.inOut', onComplete: () => { if (leaving) box.innerHTML = ''; } }); };
        if (tween && tween.isActive()) tween.eventCallback('onComplete', out); else out();
      });
    });
  }
  function drawAlways(el, delay) {
    const box = el.querySelector('.draw-box'); const p = makeLine(box);
    if (reduce) return;
    gsap.fromTo(p, { drawSVG: '0%' }, { drawSVG: '100%', duration: 0.6, ease: 'power2.inOut', delay });
  }

  /* 6.6 Peso da fonte segue o cursor */
  function initFontWeightHover() {
    if (touch || reduce) return;
    const roots = [...document.querySelectorAll('[data-font-weight-hover]')].filter(el => !el.parentElement.closest('[data-font-weight-hover]'));
    const items = [];
    const pointer = { x: -9999, y: -9999 };
    const measure = () => items.forEach(it => { const r = it.ch.getBoundingClientRect(); it.cx = r.left + scrollX + r.width / 2; it.cy = r.top + scrollY + r.height / 2; });
    const setup = chars => {
      chars.forEach(ch => {
        const host = ch.closest('[data-font-weight-hover]');
        const rest = +host.dataset.rest, near = +host.dataset.near, radius = +host.dataset.radius;
        ch.style.setProperty('--wght', rest);
        ch.style.fontVariationSettings = "'wght' var(--wght)";
        items.push({ ch, rest, near, radius, cur: rest, q: gsap.quickTo(ch, '--wght', { duration: 0.4, ease: 'power2.out' }) });
      });
      measure();
    };
    roots.forEach(r => {
      if (r.hasAttribute('data-text-reveal') || r.hasAttribute('data-scroll-reveal')) r.addEventListener('reveal:done', () => setup(r._split.chars), { once: true });
      else setup(SplitText.create(r, { type: 'chars,words', autoSplit: false }).chars);
    });
    addEventListener('pointermove', e => { pointer.x = e.clientX + scrollX; pointer.y = e.clientY + scrollY; }, { passive: true });
    let lastY = scrollY;
    addEventListener('scroll', () => { pointer.y += scrollY - lastY; lastY = scrollY; measure(); }, { passive: true });
    addEventListener('resize', measure);
    gsap.ticker.add(() => {
      for (const it of items) {
        const d = Math.hypot(pointer.x - it.cx, pointer.y - it.cy);
        const f = d >= it.radius ? 0 : 1 - d / it.radius;
        const lo = Math.min(it.rest, it.near), hi = Math.max(it.rest, it.near);
        const t = clamp(lo, hi, it.rest + (it.near - it.rest) * f);
        if (Math.abs(t - it.cur) >= 1) { it.cur = t; it.q(t); }
      }
    });
  }

  /* 6.7 Cartão de foto que segue o cursor */
  function initCursorCards() {
    const hero = document.querySelector('[data-cursor-cards]');
    if (!hero || !finePointer || innerWidth < 992) return;
    const card = hero.querySelector('.ccard'), media = card.querySelector('.media');
    const imgs = [...media.querySelectorAll('img')];
    const threshold = +hero.dataset.cursorCards || 300;
    gsap.set(card, { autoAlpha: 0 });
    const qx = gsap.quickTo(card, 'x', { duration: 1, ease: 'power4' });
    const qy = gsap.quickTo(card, 'y', { duration: 1, ease: 'power4' });
    const qr = gsap.quickTo(card, 'rotation', { duration: 1, ease: 'power4' });
    const mx = gsap.quickTo(media, 'xPercent', { duration: 0.6, ease: 'power2' });
    const my = gsap.quickTo(media, 'yPercent', { duration: 0.7, ease: 'power2' });
    let first = true, lastX = 0, lastY = 0, travel = 0, idx = 0, idle = 0, hidden = false;
    hero.addEventListener('mousemove', e => {
      const x = e.clientX - innerWidth / 2, y = e.clientY - innerHeight / 2 - hero.getBoundingClientRect().top;
      if (e.target.closest('a,button')) { if (!hidden) { hidden = true; gsap.to(card, { autoAlpha: 0, duration: 0.25, ease: 'power2.out' }); } return; }
      if (hidden) { hidden = false; gsap.to(card, { autoAlpha: 1, duration: 0.25, ease: 'power2.out' }); }
      if (first) { first = false; gsap.set(card, { x, y }); lastX = x; lastY = y; gsap.to(card, { autoAlpha: 1, duration: 0.3 }); return; }
      const dx = (x - lastX) / 2, dy = (y - lastY) / 2;
      qr((x - lastX) / 4); qx(x); qy(y);
      mx(-clamp(-8, 8, dx)); my(-clamp(-8, 8, dy));
      travel += Math.abs(dx) + Math.abs(dy);
      if (travel > threshold) { travel = 0; imgs[idx].classList.remove('on'); idx = (idx + 1) % imgs.length; imgs[idx].classList.add('on'); }
      lastX = x; lastY = y;
      clearTimeout(idle); idle = setTimeout(() => { qr(0); mx(0); my(0); }, 66);
    });
    hero.addEventListener('mouseleave', () => { first = true; travel = 0; qr(0); mx(0); my(0); gsap.to(card, { autoAlpha: 0, duration: 0.3 }); });
  }

  /* 6.8 Faixa que inverte com a direção da rolagem */
  function initMarquee() {
    document.querySelectorAll('[data-marquee]').forEach(mq => {
      const scroll = mq.querySelector('.scroll'), coll = mq.querySelector('.coll');
      const dir = mq.dataset.direction === 'right' ? 1 : -1;
      const speed = +mq.dataset.speed || 30;
      for (let i = 0; i < 2; i++) scroll.appendChild(coll.cloneNode(true));
      if (reduce) return;
      const f = innerWidth < 479 ? 0.25 : innerWidth < 991 ? 0.5 : 1;
      const dur = speed * (coll.offsetWidth / innerWidth) * f;
      const colls = scroll.querySelectorAll('.coll');
      gsap.set(colls, { xPercent: dir === 1 ? -100 : 0 });
      const tl = gsap.to(colls, { xPercent: dir === 1 ? 0 : -100, repeat: -1, ease: 'none', duration: dur });
      tl.totalProgress(0.5);
      ScrollTrigger.create({ trigger: mq, start: 'top bottom', end: 'bottom top',
        onUpdate: self => gsap.to(tl, { timeScale: self.direction === 1 ? 1 : -1, duration: 0.3, overwrite: true }) });
      gsap.fromTo(scroll, { x: '10vw' }, { x: '-10vw', ease: 'none', scrollTrigger: { trigger: mq, start: 'top bottom', end: 'bottom top', scrub: 0 } });
    });
  }

  /* 6.2 Sequência de abertura */
  function init() {
    initDrawLines();
    initFontWeightHover();
    initCursorCards();
    initMarquee();
    ScrollTrigger.refresh();
  }
  const start = () => {
    if (root.hasAttribute('data-page-ready')) return;
    root.setAttribute('data-page-ready', '');
    const main = document.querySelector('main');
    const wipe = document.querySelector('.wipe'), path = wipe.querySelector('path');
    if (reduce) {
      wipe.setAttribute('data-transition-ready', '');
      document.querySelectorAll('[data-text-reveal],[data-scroll-reveal]').forEach(e => e.style.visibility = 'visible');
      init(); drawAlways(document.querySelector('.cta .txt'), 0); return;
    }
    const tl = gsap.timeline();
    tl.set(main, { autoAlpha: 0 })
      .set(path, { drawSVG: '0% 100%', strokeWidth: '30%' })
      .addLabel('reveal', 0.4)
      .set(main, { autoAlpha: 1 }, 'reveal')
      .call(() => { textReveal(0.6); init(); drawAlways(document.querySelector('.cta .txt'), 1.3); }, null, 'reveal')
      .to(path, { drawSVG: '100% 100%', strokeWidth: '5%', duration: 1.25, ease: 'power1.inOut', onComplete: () => wipe.setAttribute('data-transition-ready', '') }, 'reveal');
  };
  Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]).then(start);
})();
</script>
